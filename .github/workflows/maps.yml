# Checks each place's "Localisation" button: the host's Google Maps link still opens a
# place, near the area the guide shows (tools/check-maps-links.py).
# Run it by hand: GitHub → Actions → Maps links → Run workflow, and after changing a mapsUrl.
name: Maps links

on:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A browser, to open links the way a phone without the Google Maps app does
        run: python -m pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/check-maps-links.py
