# Downloads the guides' photos from Wikimedia Commons (tools/photos.json).
# Runs only when started by hand: GitHub → Actions → Photos → Run workflow.
# Nothing goes live from here: the result is pushed to the branch "photos-review",
# and a contact sheet of every photo, its place, author and licence to the branch
# "photos-sheet" (tools/photos-sheet.jpg). Look at it; if every photo shows exactly
# its place, with no recognisable face, merge "photos-review" into the site's branch
# (a pull request).
# With "candidates" set, it only shows what Commons offers for places without a photo
# (tools/photo-candidates.py), on the branch "photos-candidates": choose, then name the
# chosen file in tools/photos.json and run it again without "candidates".
name: Photos

on:
  workflow_dispatch:
    inputs:
      auto:
        description: 'Also pick from categories and searches when no named file works'
        type: boolean
        default: false
      force:
        description: 'Download the chosen photos again'
        type: boolean
        default: false
      candidates:
        description: 'Only show candidates: "missing" (every place without a photo) or city/id keys separated by spaces'
        type: string
        default: ''

permissions:
  contents: write

concurrency: photos

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Candidates
        if: ${{ inputs.candidates != '' }}
        env:
          KEYS: ${{ inputs.candidates }}
        run: |
          OUT="$RUNNER_TEMP/candidates"
          if [ "$KEYS" = "missing" ]; then python3 tools/photo-candidates.py "$OUT"; else read -r -a LIST <<< "$KEYS"; python3 tools/photo-candidates.py "$OUT" "${LIST[@]}"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan photos-candidates
          git rm -rq --cached . || true
          git clean -fdxq
          cp -r "$OUT"/. .
          git add -A
          git commit -qm 'Photo candidates from Wikimedia Commons (to choose from)'
          git push --force origin photos-candidates
      - name: Download
        if: ${{ inputs.candidates == '' }}
        env:
          AUTO: ${{ inputs.auto }}
          FORCE: ${{ inputs.force }}
        run: |
          set -- --sheet tools/photos-sheet.jpg
          if [ "$AUTO" != "true" ]; then set -- "$@" --exact-only; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python3 tools/fetch-photos.py "$@"
      - name: Push to the review branch
        if: ${{ inputs.candidates == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c photos-review
          git add -A -- content/photos.js tools/photos.lock.json
          if [ -d assets/img/photos ]; then git add -A -- assets/img/photos; fi
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m 'Photos: download from Wikimedia Commons (to review)'
          git push --force origin photos-review
          # The contact sheet goes on a branch of its own, so merging photos-review never publishes it
          if [ -f tools/photos-sheet.jpg ]; then
            git switch -c photos-sheet
            git add -f -- tools/photos-sheet.jpg
            git commit -m 'Contact sheet of the photos to review'
            git push --force origin photos-sheet
            echo "Review: https://github.com/${GITHUB_REPOSITORY}/blob/photos-sheet/tools/photos-sheet.jpg" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Then: https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...photos-review" >> "$GITHUB_STEP_SUMMARY"
