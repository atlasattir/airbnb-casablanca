# Downloads the guides' photos from Wikimedia Commons (tools/photos.json).
# Runs only when started by hand: GitHub → Actions → Photos → Run workflow.
# Nothing goes live from here: the result is pushed to the branch "photos-review",
# with a contact sheet (tools/photos-sheet.jpg) of every photo, its place, author
# and licence. Look at it; if every photo shows exactly its place, with no
# recognisable face, merge "photos-review" into the site's branch (a pull request).
name: Photos

on:
  workflow_dispatch:
    inputs:
      auto:
        description: 'Also pick from categories and searches when no named file works'
        type: boolean
        default: false
      force:
        description: 'Download the chosen photos again'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: photos

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Download
        env:
          AUTO: ${{ inputs.auto }}
          FORCE: ${{ inputs.force }}
        run: |
          set -- --sheet tools/photos-sheet.jpg
          if [ "$AUTO" != "true" ]; then set -- "$@" --exact-only; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python3 tools/fetch-photos.py "$@"
      - name: Push to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c photos-review
          git add -A -- content/photos.js tools/photos.lock.json
          if [ -d assets/img/photos ]; then git add -A -- assets/img/photos; fi
          if [ -f tools/photos-sheet.jpg ]; then git add -f -- tools/photos-sheet.jpg; fi
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m 'Photos: download from Wikimedia Commons (to review)'
          git push --force origin photos-review
          echo "Review: https://github.com/${GITHUB_REPOSITORY}/blob/photos-review/tools/photos-sheet.jpg" >> "$GITHUB_STEP_SUMMARY"
          echo "Then: https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...photos-review" >> "$GITHUB_STEP_SUMMARY"
