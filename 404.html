<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Darna Collection</title>
  <!-- GitHub Pages shows this page for any address that does not exist (a typo, a capital letter,
       a stray character). It sends the guest to their place's guide, or to the home to choose it.
       It works at both addresses: under github.io the site is the first folder of the address,
       on its own domain it is the root. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#091215">
  <style>body { margin: 0; background: #091215; color: #EEEAE1; font: 16px system-ui, sans-serif; } a { color: inherit; display: block; padding: 24px; }</style>
</head>
<body>
  <a id="home" href="/">Darna Collection · Votre guide · Your guide · دليلك</a>
  <script>
    (function () {
      var path = window.location.pathname;
      var base = /\.github\.io$/i.test(window.location.hostname) ? '/' + (path.split('/')[1] || '') + '/' : '/';
      var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
      rest = rest.replace(/^airbnb-casablanca(\/|$)/i, ''); // the old github.io folder, typed after the new domain
      var id = rest.split('/')[0] || '';
      try { id = decodeURIComponent(id); } catch (e) { /* a stray % */ }
      id = id.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (!id || /^[a-z0-9-]*html?$/.test(id)) id = (/[?&]stay=([a-z0-9-]+)/i.exec(window.location.search) || [])[1] || ''; // a page name, or ?stay= kept
      var to = base + (id ? '?stay=' + id : '') + window.location.hash;
      document.getElementById('home').href = base;
      if (to !== path + window.location.search + window.location.hash) window.location.replace(to);
    })();
  </script>
</body>
</html>
