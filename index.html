<!doctype html>
<html lang="fr" dir="ltr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Darna Collection</title>
  <meta name="description" content="Votre guide personnel · Casablanca · Marrakech · Martil">
  <meta name="theme-color" content="#091215">
  <!-- Guest guide: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <!-- Link preview in WhatsApp, Airbnb messages, etc. Update the URLs if you use your own domain. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Darna Collection">
  <meta property="og:description" content="Votre guide personnel · Your personal guide · Casablanca · Marrakech · Martil">
  <meta property="og:image" content="https://darnacollection.ma/assets/img/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://darnacollection.ma/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-title" content="Darna">
  <link rel="manifest" href="manifest.webmanifest" id="manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..600&family=Tajawal:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Before the first paint: saved theme, home or place mode, and the place's own
    // home-screen icon (each place folder has its manifest)
    (function () {
      var d = document.documentElement, q = window.location.search;
      try { var t = localStorage.getItem('atlas.theme') || localStorage.getItem('casa.theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
      var m = /[?&]stay=\s*([a-z0-9-]+)/i.exec(q);
      if (m) m[1] = m[1].toLowerCase();
      d.className += m ? ' mode-stay' : ' mode-home';
      if (/[?&]look=a(&|$)/.test(q)) d.className += ' look-a';
      if (m) document.getElementById('manifest').setAttribute('href', m[1] + '/manifest.webmanifest');
    })();
  </script>
</head>
<body>

  <!-- The film: fixed behind the page -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="stage__media">
      <div class="scene">
        <div class="scene__glow"></div>
        <div class="scene__sun"></div>
        <div class="scene__sea"></div>
        <div class="scene__shimmer"></div>
        <!-- Martil: the Rif mountains on the horizon -->
        <svg class="scene__hills" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M0 200V128l70-30 60 18 90-62 80 40 70-26 110 56 90-74 100 48 70-20 90 44 90-36 80 30v88z" fill="#0B1A1E" opacity=".75"/>
          <path d="M0 200v-46l110-22 90 26 120-40 110 30 100-18 130 34 100-26 140 20v42z" fill="#081215"/>
        </svg>
        <svg class="scene__mosque" viewBox="0 0 360 640" preserveAspectRatio="xMaxYMax meet" focusable="false">
          <defs>
            <pattern id="hall-windows" width="22" height="40" patternUnits="userSpaceOnUse">
              <rect x="8" y="13" width="6" height="15" rx="3" fill="#E9C48C" opacity=".32"/>
            </pattern>
          </defs>
          <g fill="#050C0E">
            <rect x="0" y="600" width="300" height="40"/>
            <rect x="110" y="584" width="150" height="20"/>
            <rect x="296" y="150" width="48" height="490"/>
            <rect x="292" y="140" width="56" height="10"/>
            <rect x="307" y="78" width="26" height="62"/>
            <rect x="304" y="70" width="32" height="8"/>
          </g>
          <rect x="0" y="600" width="292" height="40" fill="url(#hall-windows)"/>
          <path d="M320 70V20" stroke="#C9AB78" stroke-width="1.2"/>
          <g fill="#C9AB78">
            <circle cx="320" cy="57" r="5"/>
            <circle cx="320" cy="44" r="4"/>
            <circle cx="320" cy="33" r="3"/>
          </g>
          <g fill="#E9C48C" opacity=".6">
            <rect x="312" y="92" width="5" height="30" rx="2.5"/>
            <rect x="323" y="92" width="5" height="30" rx="2.5"/>
          </g>
          <g fill="none" stroke="#C9AB78" stroke-opacity=".22" stroke-width=".8">
            <rect x="302" y="166" width="36" height="76"/>
            <path d="M308 242v-48a12 12 0 0 1 24 0v48"/>
            <rect x="302" y="264" width="36" height="124"/>
            <path d="M310 378v-82a10 10 0 0 1 20 0v82"/>
            <rect x="302" y="410" width="36" height="60"/>
          </g>
          <rect x="296" y="150" width="1.2" height="490" fill="#E6B57E" opacity=".5"/>
          <rect x="307" y="78" width="1" height="62" fill="#E6B57E" opacity=".5"/>
        </svg>
      </div>
      <img class="stage__poster" id="hero-poster" alt="" decoding="async">
      <video class="stage__video" id="hero-video" muted loop playsinline preload="auto" disablepictureinpicture></video>
    </div>
    <div class="stage__veil"></div>
    <div class="stage__grain"></div>
  </div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top" aria-label="Darna Collection">
      <svg class="ico brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" focusable="false"><rect x="6.75" y="6.75" width="10.5" height="10.5"/><rect x="6.75" y="6.75" width="10.5" height="10.5" transform="rotate(45 12 12)"/></svg>
      <span class="brand__word" dir="ltr">Darna Collection</span>
    </a>
    <div class="topbar__tools">
      <nav class="langs" data-i18n-label="languages" aria-label="Langue">
        <button type="button" data-lang="fr" lang="fr" aria-pressed="false" aria-label="Français">FR</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false" aria-label="English">EN</button>
        <button type="button" data-lang="ar" lang="ar" aria-pressed="false" aria-label="العربية">ع</button>
        <button type="button" data-lang="es" lang="es" aria-pressed="false" aria-label="Español">ES</button>
      </nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-pressed="false" aria-label="Mode sombre"></button>
    </div>
  </header>

  <main>
    <section class="hero" id="top">
      <!-- Home: the brand and the choice of a place -->
      <div class="hero__inner hero__inner--home">
        <p class="eyebrow hero__kicker"><span id="home-kicker">Casablanca · Marrakech · Martil</span></p>
        <h1 class="hero__title wordmark" dir="ltr" lang="fr"><span class="l1">Darna</span> <span class="l2">Collection</span></h1>
        <div class="chooser">
          <p class="hero__tagline" data-i18n="homeTagline">Votre guide personnel</p>
          <p class="chooser__label" id="chooser-label" data-i18n="chooseStay">Choisissez votre lieu de séjour</p>
          <nav class="chooser__chips" id="city-chips" aria-labelledby="chooser-label"></nav>
          <a class="resume" id="resume" href="./" hidden></a>
          <button class="locate" id="locate-btn" type="button"></button>
          <p class="locate__note" data-i18n="locateNote">Avec votre position, qui reste sur votre téléphone</p>
        </div>
        <div class="hero__meta">
          <span class="hero__times"><span class="clock" id="clock-home" dir="ltr">--:--</span> <span data-i18n="moroccoTime">Heure du Maroc</span></span>
        </div>
      </div>
      <!-- A place: its name, neighbourhood, coordinates, local time and sunset -->
      <div class="hero__inner hero__inner--stay">
        <p class="eyebrow hero__kicker"><span id="stay-kicker"></span></p>
        <h1 class="hero__title" id="stay-title" dir="ltr"><span class="l1"></span> <span class="l2"></span></h1>
        <p class="hero__tagline" id="stay-tagline"></p>
        <div class="hero__meta">
          <span id="coords" dir="ltr"></span>
          <span class="hero__times"><span class="clock" id="clock" dir="ltr">--:--</span> <span class="clock-city" id="clock-city"></span>
            <span class="sunset"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 16.5a5 5 0 0 1 10 0"/><path d="M12 7v2.25M5.4 9.9l1.6 1.6M18.6 9.9 17 11.5M3 16.5h2M19 16.5h2"/><path d="M3 20h18"/><path d="M9.5 3.75 12 5.75l2.5-2"/></svg><span id="sunset-time" dir="ltr" aria-label="Sunset"></span></span></span>
        </div>
      </div>
      <a class="scroll-cue" id="scroll-cue" href="#menu"><span class="scroll-cue__line"></span><span data-i18n="scroll">Découvrir</span></a>
    </section>

    <section class="menu" id="menu" aria-label="Menu">
      <div class="groups" id="groups"></div>
      <noscript>
        <p class="nojs-note">Activez JavaScript pour afficher le guide. · Turn on JavaScript to see the guide. · فعّل JavaScript لعرض الدليل. · Activa JavaScript para ver la guía.</p>
      </noscript>

      <figure class="sign reveal">
        <blockquote data-i18n="signQuote">Je reste disponible pendant tout votre séjour. Une question, une envie : écrivez-moi.</blockquote>
        <figcaption class="eyebrow"><b data-host>Yassine</b><span data-i18n="yourHost">votre hôte</span></figcaption>
      </figure>
      <p class="change-stay"><a href="./?choose"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h13l-3.5-3.5"/><path d="M20 16H7l3.5 3.5"/></svg><span data-i18n="changeStay">Changer de logement</span></a></p>
      <p class="credit eyebrow" id="photo-credit" hidden><a href="#credits" data-open="credits" data-i18n="photoCredits">Crédits photos</a></p>
      <p class="credit eyebrow" id="film-credit" hidden><span data-i18n="filmBy">Film</span> <a id="film-credit-link" href="#" target="_blank" rel="noopener" dir="ltr"></a></p>
    </section>
  </main>

  <!-- Three permanent buttons -->
  <nav class="dock" data-i18n-label="dockLabel" aria-label="Accès rapide">
    <a class="dock__btn" href="#location" data-open="location">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span data-i18n="dockLocation">Localisation</span>
    </a>
    <a class="dock__btn dock__btn--main" id="dock-wa" href="https://wa.me/212600600486" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20l1.3-3.9A8.2 8.2 0 1 1 8.2 19z"/><path d="M9.4 8.6c.25-.45.7-.55 1-.15l.75 1.3c.15.3.1.6-.15.85l-.5.5c.5 1.05 1.3 1.85 2.35 2.35l.5-.5c.25-.25.55-.3.85-.15l1.3.75c.4.3.3.75-.15 1-1 .55-2.15.5-3.2-.2a7.4 7.4 0 0 1-2.6-2.6c-.7-1.05-.75-2.2-.2-3.2z"/></svg>
      <span data-i18n="dockWhatsApp">WhatsApp</span>
    </a>
    <a class="dock__btn" href="#favorites" data-open="favorites">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.4-7.5-10.1A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.3C19.5 15.6 12 20 12 20z"/></svg>
      <span data-i18n="dockFavs">Mes favoris</span>
      <span class="dock__badge" id="fav-count" hidden>0</span>
    </a>
  </nav>

  <!-- Each section opens here -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
    <div class="sheet__scroll" id="sheet-scroll">
      <div class="sheet__bar" id="sheet-bar">
        <button class="icon-btn" id="sheet-back" type="button" data-i18n-label="back" aria-label="Retour">
          <svg class="ico flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </button>
        <p class="sheet__bar-title" id="sheet-bar-title" aria-hidden="true"></p>
        <span></span>
      </div>
      <div id="sheet-band"></div>
      <div class="sheet__body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Details of one place, route or tip -->
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim"></div>
    <div class="modal__panel" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <span class="modal__grip" aria-hidden="true"></span>
      <button class="modal__close" type="button" data-modal-close data-i18n-label="close" aria-label="Fermer">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="content/ui.js"></script>
  <script src="content/brand.js"></script>
  <script src="content/photos.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
